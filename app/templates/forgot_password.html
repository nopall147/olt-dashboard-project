<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50 dark:bg-[#050b14]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - OLT Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <style>
        .hidden { display: none !important; }
    </style>
</head>
<body class="relative flex min-h-screen items-center justify-center p-4 text-slate-800 dark:text-slate-200 transition-colors duration-300">

    <!-- Theme Toggle Standalone Button -->
    <button id="theme-toggle" type="button" class="absolute top-4 right-4 rounded-lg p-2.5 text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-[#0d1d33] transition bg-white/80 dark:bg-black/50 backdrop-blur border border-slate-300 dark:border-[#162a45]">
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
    </button>

    <div class="w-full max-w-md p-6">
        <!-- Logo / Title -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-blue-700 dark:text-[#0F2942]">OLT Dashboard</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">Sistem Manajemen & Telemetri Perangkat</p>
        </div>

        <div class="rounded-2xl border border-slate-200 dark:border-[#162a45] bg-white dark:bg-[#091322] p-8 shadow-xl shadow-slate-200/50 dark:shadow-[0_0_40px_rgba(0,0,0,0.8)] transition-colors">
            <!-- Form Header -->
            <div id="formHeader" class="mb-6">
                <h2 class="text-xl font-bold text-slate-900 dark:text-slate-100">Pulihkan Password</h2>
                <p id="formSubtitle" class="text-sm text-slate-500 dark:text-slate-400 mt-1">Masukkan alamat email Anda untuk menerima kode OTP pemulihan.</p>
            </div>

            <!-- Pesan Notifikasi -->
            <div id="alertBox" class="hidden mb-4 rounded-lg p-3 text-xs font-semibold text-center transition-colors"></div>

            <!-- STEP 1: FORM REQUEST OTP -->
            <form id="requestOtpForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Alamat Email</label>
                    <input type="email" id="emailInput" required placeholder="admin@example.com" class="mt-1.5 w-full rounded-lg bg-white dark:bg-[#060c17] border border-slate-300 dark:border-[#162a45] text-slate-900 dark:text-slate-100 px-4 py-2.5 text-sm focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition-colors">
                </div>
                <button type="submit" id="btnRequestOtp" class="w-full rounded-lg bg-blue-600 dark:bg-[#00e5ff] px-4 py-2.5 text-sm font-bold text-white dark:text-black shadow-md shadow-blue-500/30 dark:shadow-[0_0_15px_rgba(0,229,255,0.35)] hover:bg-blue-700 dark:hover:bg-[#00c8e0] transition flex items-center justify-center gap-2 cursor-pointer">
                    Kirim Kode OTP
                </button>
                <div class="text-center">
                    <a href="/login" class="text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">Kembali ke Login</a>
                </div>
            </form>

            <!-- STEP 2: FORM VALIDASI OTP & RESET PASSWORD (Awalnya Disembunyikan) -->
            <form id="resetPasswordForm" class="hidden space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Kode OTP (6 Digit)</label>
                    <input type="text" id="otpCodeInput" required maxlength="6" placeholder="Buka email Anda..." class="mt-1.5 w-full rounded-lg bg-white dark:bg-[#060c17] border border-slate-300 dark:border-[#162a45] px-4 py-2.5 text-center text-lg tracking-[0.5em] font-bold text-blue-600 dark:text-[#00e5ff] focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Password Baru</label>
                    <input type="password" id="newPasswordInput" required placeholder="Minimal 6 karakter" class="mt-1.5 w-full rounded-lg bg-white dark:bg-[#060c17] border border-slate-300 dark:border-[#162a45] text-slate-900 dark:text-slate-100 px-4 py-2.5 text-sm focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition-colors">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300">Konfirmasi Password Baru</label>
                    <input type="password" id="confirmPasswordInput" required class="mt-1.5 w-full rounded-lg bg-white dark:bg-[#060c17] border border-slate-300 dark:border-[#162a45] text-slate-900 dark:text-slate-100 px-4 py-2.5 text-sm focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition-colors">
                </div>
                <button type="submit" id="btnResetPassword" class="mt-2 w-full rounded-lg bg-emerald-600 dark:bg-emerald-500 px-4 py-2.5 text-sm font-bold text-white dark:text-black shadow-md shadow-emerald-500/30 hover:bg-emerald-700 dark:hover:bg-emerald-600 transition flex items-center justify-center gap-2 cursor-pointer">
                    Simpan Password Baru
                </button>
                <div class="text-center mt-3">
                    <button type="button" onclick="location.reload()" class="text-xs font-semibold text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition">Kirim Ulang Email</button>
                </div>
            </form>

        </div>
    </div>

    <!-- Logika Dark Mode Standalone -->
    <script>
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    </script>

    <script>
        const requestOtpForm = document.getElementById('requestOtpForm');
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const alertBox = document.getElementById('alertBox');
        
        let targetEmail = ""; 

        function showAlert(message, isError) {
            alertBox.textContent = message;
            alertBox.className = `mb-4 rounded-lg p-3 text-xs font-semibold text-center ${isError ? 'bg-rose-50 dark:bg-[#ff3366]/10 text-rose-600 dark:text-[#ff3366] border border-rose-200 dark:border-[#ff3366]/30' : 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-200 dark:border-emerald-500/30'} transition-colors`;
            alertBox.classList.remove('hidden');
        }

        // --- STEP 1: Handle Minta OTP ---
        requestOtpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnRequestOtp');
            const email = document.getElementById('emailInput').value;
            
            btn.disabled = true;
            btn.textContent = "Mengirim...";
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Terjadi kesalahan saat memproses permintaan.");
                }

                targetEmail = email;
                requestOtpForm.classList.add('hidden');
                resetPasswordForm.classList.remove('hidden');
                
                document.getElementById('formSubtitle').innerHTML = `OTP telah dikirim ke <b class="text-slate-800 dark:text-slate-200">${email}</b>.<br>Cek kotak masuk atau folder spam Anda.`;
                showAlert("Email OTP berhasil dikirim!", false);

            } catch (error) {
                showAlert(error.message, true);
                btn.disabled = false;
                btn.textContent = "Kirim Kode OTP";
            }
        });

        // --- STEP 2: Handle Reset Password ---
        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnResetPassword');
            const otpCode = document.getElementById('otpCodeInput').value;
            const newPassword = document.getElementById('newPasswordInput').value;
            const confirmPassword = document.getElementById('confirmPasswordInput').value;

            if (newPassword !== confirmPassword) {
                showAlert("Konfirmasi password tidak cocok!", true);
                return;
            }

            if (newPassword.length < 6) {
                showAlert("Password baru minimal 6 karakter!", true);
                return;
            }

            btn.disabled = true;
            btn.textContent = "Memproses...";
            alertBox.classList.add('hidden');

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        email: targetEmail,
                        otp_code: otpCode,
                        new_password: newPassword
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || "Gagal mereset password.");
                }

                showAlert("Password berhasil diubah! Mengarahkan ke halaman login...", false);
                setTimeout(() => {
                    window.location.href = '/login';
                }, 2000);

            } catch (error) {
                showAlert(error.message, true);
                btn.disabled = false;
                btn.textContent = "Simpan Password Baru";
            }
        });
    </script>
</body>
</html>
