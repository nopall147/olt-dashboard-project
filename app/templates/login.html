<!DOCTYPE html>
<html lang="id" class="h-full bg-slate-50 dark:bg-[#050b14]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OLT Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', }
    </script>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background: url('/static/img/backgroundlogin.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        /* Di light mode background lebih polos atau beri efek putih agar beda */
        html:not(.dark) body {
            background: #f8fafc; /* Warna slate-50 murni sebagai fallback tanpa gambar */
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        html.dark .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.65);
        }

        html.dark .cyber-card {
            background: rgba(9, 19, 34, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 229, 255, 0.12);
        }
    </style>
</head>
<body class="relative flex min-h-screen items-center justify-center p-4 text-slate-800 dark:text-slate-300 transition-colors duration-300">
    <!-- Overlay Gelap Halus Agar Gambar Tidak Menabrak Form (Hanya di mode gelap) -->
    <div class="fixed inset-0 hidden dark:block bg-[#050b14]/60 pointer-events-none transition-colors"></div>

    <!-- Theme Toggle Standalone Button -->
    <button id="theme-toggle" type="button" class="absolute top-4 right-4 rounded-lg p-2.5 text-slate-500 hover:bg-slate-200 dark:text-slate-400 dark:hover:bg-[#0d1d33] transition bg-white/80 dark:bg-black/50 backdrop-blur border border-slate-300 dark:border-[#162a45]">
        <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-amber-500" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
    </button>

    <div class="cyber-card bg-white/90 border border-slate-300 shadow-xl dark:border-[#162a45] relative z-10 w-full max-w-md rounded-2xl p-8 transition-colors">
        
        <!-- Header Section with Logo -->
        <div class="text-center">
            <div class="flex flex-col items-center justify-center mb-3">
                <img 
                    src="/static/img/agak gelap.png" 
                    alt="NSC CONFIG Logo" 
                    class="h-12 w-auto object-contain drop-shadow-none dark:drop-shadow-[0_0_12px_rgba(0,229,255,0.45)] transition-all"
                >
                <span class="mt-2 text-base font-bold uppercase tracking-wider text-blue-700 dark:text-[#00e5ff] dark:neon-glow-cyan transition-colors">
                    NSC CONFIG
                </span>
            </div>
            <h1 class="text-lg font-bold uppercase tracking-wider text-slate-800 dark:text-slate-200">Sign In</h1>
            <p class="mt-1 text-[11px] uppercase tracking-wide text-slate-500 dark:text-slate-400">OLT Monitoring & Provisioning Platform</p>
        </div>

        <!-- Alert Error -->
        {% if error %}
        <div class="mt-5 rounded-lg bg-rose-50 dark:bg-[#250d18]/90 border border-rose-200 dark:border-[#ff3366]/40 p-3 text-xs text-rose-600 dark:text-[#ff3366] flex items-center gap-2 shadow-none dark:shadow-[0_0_10px_rgba(255,51,102,0.15)] transition-colors">
            <svg class="h-4 w-4 shrink-0 text-rose-600 dark:text-[#ff3366]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <path d="M12 8v4m0 4h.01" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="font-medium tracking-tight">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form Login -->
        <form action="/login" method="POST" class="mt-6 space-y-4 text-xs font-medium">
            <div>
                <label class="block uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1 text-[11px]">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    required 
                    autofocus 
                    placeholder="Enter username"
                    class="w-full rounded-lg bg-white dark:bg-[#060c17]/90 border border-slate-300 dark:border-[#162a45] px-3.5 py-2.5 text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition transition-colors"
                >
            </div>

            <div>
                <label class="block uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1 text-[11px]">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full rounded-lg bg-white dark:bg-[#060c17]/90 border border-slate-300 dark:border-[#162a45] px-3.5 py-2.5 text-slate-800 dark:text-slate-200 placeholder:text-slate-400 dark:placeholder:text-slate-600 focus:border-blue-500 dark:focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-blue-500 dark:focus:ring-[#00e5ff] transition transition-colors"
                >
            </div>

            <button 
                type="submit"
                class="w-full rounded-lg bg-blue-600 dark:bg-[#00e5ff] py-2.5 text-xs font-bold uppercase tracking-wider text-white dark:text-black shadow-md dark:shadow-[0_0_15px_rgba(0,229,255,0.35)] hover:bg-blue-700 dark:hover:bg-[#00c8e0] dark:hover:shadow-[0_0_20px_rgba(0,229,255,0.5)] active:scale-[0.99] transition cursor-pointer"
            >
                Sign In
            </button>
            <div class="mb-5 flex items-center justify-between mt-4">
                <div class="flex items-center">
                    <input type="checkbox" id="remember_me" class="h-4 w-4 rounded border-slate-300 dark:border-[#162a45] bg-white dark:bg-[#060c17] text-blue-600 dark:text-[#00e5ff]">
                    <label for="remember_me" class="ml-2 block text-xs text-slate-600 dark:text-slate-400">Ingat saya</label>
                </div>
                <div class="text-xs">
                    <a href="/forgot-password" class="font-semibold text-blue-600 dark:text-[#00e5ff] hover:text-blue-800 dark:hover:text-white transition">Lupa password?</a>
                </div>
            </div>
        </form>
    </div>

    <!-- Logika Toggle Dark Mode untuk standalone page -->
    <script>
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');
        const themeToggleBtn = document.getElementById('theme-toggle');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');

            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    </script>
</body>
</html>
