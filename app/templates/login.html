<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - OLT Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'JetBrains Mono', monospace; 
            background: #050b14 url('/static/img/backgroundlogin.jpg') no-repeat center center fixed;
            background-size: cover;
        }

        .neon-glow-cyan {
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.65);
        }

        .cyber-card {
            background: rgba(9, 19, 34, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 229, 255, 0.12);
        }
    </style>
</head>
<body class="relative flex min-h-screen items-center justify-center p-4 text-slate-300">
    <!-- Overlay Gelap Halus Agar Gambar Tidak Menabrak Form -->
    <div class="fixed inset-0 bg-[#050b14]/60 pointer-events-none"></div>

    <div class="cyber-card relative z-10 w-full max-w-md rounded-2xl border border-[#162a45] p-8">
        
        <!-- Header Section with Logo -->
        <div class="text-center">
            <div class="flex flex-col items-center justify-center mb-3">
                <img 
                    src="/static/img/agak gelap.png" 
                    alt="NSC CONFIG Logo" 
                    class="h-12 w-auto object-contain drop-shadow-[0_0_12px_rgba(0,229,255,0.45)]"
                >
                <span class="mt-2 text-base font-bold uppercase tracking-wider text-[#00e5ff] neon-glow-cyan">
                    NSC CONFIG
                </span>
            </div>
            <h1 class="text-lg font-bold uppercase tracking-wider text-slate-200">Sign In</h1>
            <p class="mt-1 text-[11px] uppercase tracking-wide text-slate-400">OLT Monitoring & Provisioning Platform</p>
        </div>

        <!-- Alert Error -->
        {% if error %}
        <div class="mt-5 rounded-lg bg-[#250d18]/90 border border-[#ff3366]/40 p-3 text-xs text-[#ff3366] flex items-center gap-2 shadow-[0_0_10px_rgba(255,51,102,0.15)]">
            <svg class="h-4 w-4 shrink-0 text-[#ff3366]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <path d="M12 8v4m0 4h.01" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <span class="font-medium tracking-tight">{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form Login -->
        <form action="/login" method="POST" class="mt-6 space-y-4 text-xs font-medium">
            <div>
                <label class="block uppercase tracking-wider text-slate-400 mb-1 text-[11px]">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    required 
                    autofocus 
                    placeholder="Enter username"
                    class="w-full rounded-lg bg-[#060c17]/90 border border-[#162a45] px-3.5 py-2.5 text-slate-200 placeholder:text-slate-600 focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-[#00e5ff] transition"
                >
            </div>

            <div>
                <label class="block uppercase tracking-wider text-slate-400 mb-1 text-[11px]">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    class="w-full rounded-lg bg-[#060c17]/90 border border-[#162a45] px-3.5 py-2.5 text-slate-200 placeholder:text-slate-600 focus:border-[#00e5ff] focus:outline-none focus:ring-1 focus:ring-[#00e5ff] transition"
                >
            </div>

            <button 
                type="submit"
                class="w-full rounded-lg bg-[#00e5ff] py-2.5 text-xs font-bold uppercase tracking-wider text-black shadow-[0_0_15px_rgba(0,229,255,0.35)] hover:bg-[#00c8e0] hover:shadow-[0_0_20px_rgba(0,229,255,0.5)] active:scale-[0.99] transition cursor-pointer"
            >
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
