<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - OLT Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        
        <!-- Header -->
        <div class="text-center">
            <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-blue-600 mb-3">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Buat Akun Baru</h1>
            <p class="mt-1 text-xs text-slate-500">Daftar untuk mengakses dashboard OLT</p>
        </div>

        <!-- Alert Error -->
        {% if error %}
        <div class="mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700 flex items-center gap-2">
            <svg class="h-4 w-4 shrink-0 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M12 8v4m0 4h.01" stroke-width="2" stroke-linecap="round"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form Sign Up -->
        <form action="/signup" method="POST" class="mt-6 space-y-3.5 text-xs font-medium text-slate-700">
            <div>
                <label class="block text-slate-600 mb-1">Nama Lengkap</label>
                <input type="text" name="fullname" required placeholder="Contoh: Budi Santoso"
                    class="w-full rounded-lg border border-slate-200 px-3.5 py-2 text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-600 mb-1">Username</label>
                <input type="text" name="username" required placeholder="Contoh: budi_noc"
                    class="w-full rounded-lg border border-slate-200 px-3.5 py-2 text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-600 mb-1">Email</label>
                <input type="email" name="email" required placeholder="budi@example.com"
                    class="w-full rounded-lg border border-slate-200 px-3.5 py-2 text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-slate-600 mb-1">Password</label>
                <input type="password" name="password" minlength="6" required placeholder="Minimal 6 karakter"
                    class="w-full rounded-lg border border-slate-200 px-3.5 py-2 text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>

            <button type="submit"
                class="w-full rounded-lg bg-blue-600 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-blue-700 transition mt-2">
                Daftar Sekarang
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">
            Sudah memiliki akun? 
            <a href="/login" class="font-semibold text-blue-600 hover:text-blue-700">Masuk di sini</a>
        </p>
    </div>
</body>
</html>
