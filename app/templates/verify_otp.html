<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - OLT Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-sm">
        
        <!-- Icon & Judul -->
        <div class="text-center">
            <div class="inline-flex h-12 w-12 items-center justify-center rounded-xl bg-blue-50 text-blue-600 mb-3">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-900">Verifikasi Email</h1>
            <p class="mt-1 text-xs text-slate-500">
                Masukkan 6 digit kode OTP yang kami kirimkan ke:<br>
                <b class="text-slate-800">{{ email }}</b>
            </p>
        </div>

        <!-- Alert Error -->
        {% if error %}
        <div class="mt-4 rounded-lg bg-rose-50 border border-rose-200 p-3 text-xs text-rose-700 flex items-center gap-2">
            <svg class="h-4 w-4 shrink-0 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M12 8v4m0 4h.01" stroke-width="2" stroke-linecap="round"/></svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <!-- Form Input OTP -->
        <form action="/verify-otp" method="POST" class="mt-6 space-y-4">
            <input type="hidden" name="email" value="{{ email }}">
            
            <div>
                <label class="block text-center text-xs font-semibold text-slate-600 mb-2">Kode OTP (6 Digit)</label>
                <input type="text" name="otp" required maxlength="6" autofocus placeholder="123456"
                    class="w-full text-center text-2xl font-mono tracking-widest rounded-xl border border-slate-200 py-3 text-slate-900 placeholder:text-slate-300 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-100">
            </div>

            <button type="submit"
                class="w-full rounded-lg bg-blue-600 py-2.5 text-xs font-semibold text-white shadow-sm hover:bg-blue-700 transition">
                Verifikasi & Aktifkan Akun
            </button>
        </form>

        <p class="mt-6 text-center text-xs text-slate-500">
            Salah email? 
            <a href="/signup" class="font-semibold text-blue-600 hover:text-blue-700">Daftar ulang</a>
        </p>
    </div>
</body>
</html>
